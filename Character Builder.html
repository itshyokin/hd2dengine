<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body style="margin:0">
<title>Sprite Character Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: a workbench. Left, the stage (big walking preview, turnaround, sheet); right, the wardrobe
   (body type, part categories, part tiles, colours). Stacks to one column on narrow screens.
   Same palette as the engine's editor: night navy with an ember accent. */
:root {
  --bg: #0b0e16;
  --surface: #121624;
  --surface-2: #181d2e;
  --raised: #1f2538;
  --ink: #ece6d6;
  --muted: #9aa0b5;
  --faint: #6b7189;
  --line: rgba(236, 230, 214, 0.1);
  --line-strong: rgba(236, 230, 214, 0.22);
  --ember: #ffb04a;
  --ember-ink: #2a1606;
  --ember-soft: rgba(255, 176, 74, 0.14);
  --sky: #7fd3ff;
  --danger: #ff7b6b;
  --ok: #8fd18a;
  --f-display: "Silkscreen", ui-monospace, "Courier New", monospace;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 10px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { min-height: 100%; display: grid; grid-template-rows: auto 1fr; }

/* Top bar */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.brand { font-family: var(--f-display); font-size: 13px; letter-spacing: 0.06em; color: var(--ember); white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.brand i { display: inline-block; width: 10px; height: 10px; background: var(--ember); box-shadow: 3px 3px 0 var(--ember-ink), 0 0 0 1px var(--ember); }
.name-field { flex: 1 1 200px; min-width: 0; }
.name-field input { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--bg); font-size: 16px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { min-height: 40px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--raised); display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.btn:hover { border-color: var(--ember); }
.btn.primary { background: var(--ember); color: var(--ember-ink); border-color: var(--ember); font-weight: 700; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); border-color: rgba(255, 123, 107, 0.45); background: transparent; }
.btn[disabled] { opacity: 0.45; cursor: default; }
.btn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ember-ink); display: none; }
.btn.primary.dirty .dot { display: inline-block; }
.btn .count { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }

/* Studio */
.studio { display: grid; grid-template-columns: minmax(300px, 0.9fr) minmax(0, 1.3fr); gap: 0; min-height: 0; }
.stage { padding: 16px; border-right: 1px solid var(--line); display: grid; gap: 14px; align-content: start; }
.stage-view { position: relative; border-radius: var(--r); overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); aspect-ratio: 4 / 3.4; max-height: 52vh; width: 100%; }
.stage-view canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.stage-tag { position: absolute; left: 10px; bottom: 8px; font: 11px var(--f-mono); color: var(--ink); background: rgba(11, 14, 22, 0.66); padding: 3px 7px; border-radius: 5px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.seg button { min-width: 44px; min-height: 40px; padding: 6px 10px; background: transparent; border: 0; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"], .seg button[aria-checked="true"] { background: var(--ember-soft); color: var(--ember); }
.turn { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.turn figure { margin: 0; display: grid; gap: 4px; justify-items: center; }
.turn canvas { width: 100%; aspect-ratio: 2 / 3; image-rendering: pixelated; border-radius: 8px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; }
.turn canvas.on { box-shadow: inset 0 0 0 2px var(--ember); }
.turn figcaption { font-size: 11px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.sheet-box { border-radius: var(--r); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.sheet-box summary { padding: 10px 12px; cursor: pointer; color: var(--muted); font-size: 13px; }
.sheet-box .inner { padding: 0 12px 12px; display: grid; gap: 8px; justify-items: start; }
.sheet-box canvas { image-rendering: pixelated; max-width: 100%; background: repeating-conic-gradient(#232a3e 0% 25%, #1a2032 0% 50%) 0 0 / 16px 16px; border-radius: 6px; }
.meta { font: 12px var(--f-mono); color: var(--muted); }

.wardrobe { padding: 16px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.bodies { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.bodies button { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 10px; padding: 8px 12px; border-radius: var(--r); border: 1px solid var(--line-strong); background: var(--surface); text-align: left; min-height: 56px; }
.bodies button canvas { width: 28px; height: 42px; image-rendering: pixelated; }
.bodies button b { font-family: var(--f-display); font-weight: 400; font-size: 12px; letter-spacing: 0.04em; }
.bodies button[aria-checked="true"] { border-color: var(--ember); background: var(--ember-soft); }
.cats { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.cats button { flex: none; min-height: 40px; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line-strong); background: transparent; color: var(--muted); }
.cats button .pick { color: var(--faint); font-size: 12px; margin-left: 4px; }
.cats button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 700; }
.cats button[aria-selected="true"] .pick { color: #555a6e; }
.panel { background: var(--surface); border-radius: var(--r); box-shadow: inset 0 0 0 1px var(--line); padding: 12px; display: grid; gap: 10px; }
.panel h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.panel h2 small { font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 12px; color: var(--faint); }
.parts { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.tile { display: grid; gap: 4px; padding: 6px 6px 8px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); text-align: center; position: relative; }
.tile canvas { width: 100%; aspect-ratio: 2 / 3; image-rendering: pixelated; border-radius: 6px; background: #1a2032; }
.tile span { font-size: 12.5px; line-height: 1.2; overflow-wrap: anywhere; }
.tile[aria-pressed="true"] { border-color: var(--ember); box-shadow: 0 0 0 1px var(--ember); background: var(--ember-soft); }
.tile .mine { position: absolute; top: 9px; right: 9px; font: 10px var(--f-mono); background: var(--sky); color: #06202e; border-radius: 4px; padding: 1px 5px; }
.tile.none canvas { background: repeating-linear-gradient(135deg, #1a2032 0 6px, #161b2a 6px 12px); }
.colors { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sw { width: 36px; height: 36px; border-radius: 8px; border: 2px solid transparent; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35); }
.sw[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ember); }
.custom { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 8px; border: 1px solid var(--line-strong); min-height: 40px; }
.custom input { width: 32px; height: 30px; border: 0; padding: 0; background: none; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.empty { padding: 14px; border: 1px dashed var(--line-strong); border-radius: 9px; color: var(--muted); font-size: 13px; }

/* Side sheets (characters, library) */
.scrim { position: fixed; inset: 0; background: rgba(4, 6, 12, 0.6); z-index: 20; display: flex; justify-content: flex-end; }
.side { width: min(640px, 100%); height: 100%; background: var(--surface); border-left: 1px solid var(--line-strong); display: grid; grid-template-rows: auto 1fr; padding-top: env(safe-area-inset-top, 0px); }
.side-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.side-head h1 { margin: 0; font: 400 15px var(--f-display); letter-spacing: 0.05em; color: var(--ember); }
.side-body { overflow-y: auto; padding: 16px; display: grid; gap: 16px; align-content: start; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.chip.cloud { color: var(--ok); border-color: rgba(143, 209, 138, 0.35); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.field select, .field input[type=text] { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--ink); min-height: 40px; }
.list { display: grid; gap: 8px; }
.item { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); }
.item canvas { width: 56px; height: 84px; image-rendering: pixelated; border-radius: 6px; background: #1a2032; }
.item .info { display: grid; gap: 6px; min-width: 0; }
.item .info input { width: 100%; padding: 6px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); }
.item .info .sub { font-size: 12px; color: var(--muted); }
.item .info .row select { padding: 5px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); min-height: 34px; font-size: 13px; }
.item .btns { display: flex; flex-direction: column; gap: 6px; }
.item .btns .btn { min-height: 34px; padding: 5px 10px; font-size: 13px; }
.group-title { margin: 6px 0 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); }
.rules { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13.5px; display: grid; gap: 4px; }
.rules code, .hint code { font-family: var(--f-mono); font-size: 12px; color: var(--ink); background: var(--bg); padding: 1px 5px; border-radius: 4px; }
.swatch-inline { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.4); }
.progress { font: 12px var(--f-mono); color: var(--sky); }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 9px; font-weight: 700; font-size: 14px; z-index: 40; max-width: calc(100% - 32px); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); }
.toast.bad { background: var(--danger); color: #2a0703; }

@media (max-width: 900px) {
  .studio { grid-template-columns: 1fr; }
  .stage { border-right: 0; border-bottom: 1px solid var(--line); }
  .stage-view { aspect-ratio: 16 / 10; max-height: 34vh; }
  .turn { max-width: 420px; width: 100%; justify-self: center; }
}
@media (max-width: 520px) {
  .bar { padding: 10px 16px; }
  .bodies button { grid-template-columns: 1fr; justify-items: center; text-align: center; padding: 6px; }
  .bodies button b { font-size: 10px; }
  .item { grid-template-columns: 48px minmax(0, 1fr); }
  .item .btns { grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="bar">
    <div class="brand"><i aria-hidden="true"></i>Character Builder</div>
    <label class="name-field"><span class="sr">Character name</span><input id="charName" type="text" autocomplete="off" spellcheck="false"></label>
    <div class="actions">
      <button class="btn" id="btnRandom" type="button">Randomize</button>
      <button class="btn" id="btnNew" type="button">New</button>
      <button class="btn primary" id="btnSave" type="button"><span class="dot" aria-hidden="true"></span>Save</button>
      <button class="btn" id="btnExport" type="button">Export PNG</button>
      <button class="btn ghost" id="btnChars" type="button">Characters <span class="count" id="charCount"></span></button>
      <button class="btn ghost" id="btnLib" type="button">Parts library</button>
    </div>
  </header>

  <main class="studio">
    <section class="stage" aria-label="Preview">
      <div class="stage-view"><canvas id="preview" aria-label="Your character, walking"></canvas><span class="stage-tag" id="stageTag"></span></div>
      <div class="controls">
        <div class="seg" role="group" aria-label="Facing" id="dirs">
          <button type="button" data-row="0" aria-label="Face down">↓</button><button type="button" data-row="1" aria-label="Face left">←</button><button type="button" data-row="2" aria-label="Face right">→</button><button type="button" data-row="3" aria-label="Face up">↑</button>
        </div>
        <div class="seg" role="group" aria-label="Motion">
          <button type="button" id="btnWalk" aria-pressed="true">Walk</button><button type="button" id="btnStand" aria-pressed="false">Stand</button>
        </div>
        <div class="seg" role="group" aria-label="Background" id="bgs">
          <button type="button" data-bg="grass">Grass</button><button type="button" data-bg="stone">Stone</button><button type="button" data-bg="check">Clear</button>
        </div>
      </div>
      <div class="turn" id="turn"></div>
      <details class="sheet-box" id="sheetBox">
        <summary>Full sheet (what Export PNG saves)</summary>
        <div class="inner"><canvas id="sheet"></canvas><span class="meta" id="sheetMeta"></span></div>
      </details>
    </section>

    <section class="wardrobe" aria-label="Wardrobe">
      <div class="bodies" role="radiogroup" aria-label="Body type" id="bodies"></div>
      <nav class="cats" role="tablist" aria-label="Part" id="cats"></nav>
      <div class="panel">
        <h2><span id="catTitle">Hair</span><small id="catNote"></small></h2>
        <div class="parts" id="parts"></div>
      </div>
      <div class="panel" id="colorPanel">
        <h2><span>Colour</span><small id="colorNote">Greys in a part take this colour</small></h2>
        <div class="colors" id="colors"></div>
      </div>
    </section>
  </main>
</div>

<div class="scrim" id="charsSheet" hidden>
  <div class="side" role="dialog" aria-modal="true" aria-labelledby="charsTitle">
    <div class="side-head"><h1 id="charsTitle">Characters</h1><div class="row"><button class="btn" type="button" id="btnExportAll">Export all (.zip)</button><button class="btn ghost" type="button" data-close>Close</button></div></div>
    <div class="side-body" id="charsBody"></div>
  </div>
</div>

<div class="scrim" id="libSheet" hidden>
  <div class="side" role="dialog" aria-modal="true" aria-labelledby="libTitle">
    <div class="side-head"><h1 id="libTitle">Parts library</h1><button class="btn ghost" type="button" data-close>Close</button></div>
    <div class="side-body" id="libBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="filePng" accept="image/png" multiple hidden>
<input type="file" id="fileZip" accept=".zip,application/zip" hidden>

<script>
(() => {
"use strict";
// ---------------------------------------------------------------------------------------------------------------
// Zip files without a library: writing stores files as they are (PNGs are already compressed); reading handles
// stored and deflated entries (what Windows, macOS, Android and art apps make) with the browser's own
// DecompressionStream.
// ---------------------------------------------------------------------------------------------------------------

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(bytes) {
  let c = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

const Zip = {
  /** files: [{ name, data: Blob | string | Uint8Array }] → a .zip Blob. */
  async write(files) {
    const enc = new TextEncoder(), parts = [], central = [];
    let offset = 0;
    const d = new Date(), time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1), date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    for (const f of files) {
      const name = enc.encode(f.name);
      const data = typeof f.data === 'string' ? enc.encode(f.data) : f.data instanceof Uint8Array ? f.data : new Uint8Array(await f.data.arrayBuffer());
      const crc = crc32(data);
      const local = new DataView(new ArrayBuffer(30));
      local.setUint32(0, 0x04034b50, true); local.setUint16(4, 20, true); local.setUint16(6, 0x0800, true); local.setUint16(8, 0, true);
      local.setUint16(10, time, true); local.setUint16(12, date, true); local.setUint32(14, crc, true);
      local.setUint32(18, data.length, true); local.setUint32(22, data.length, true); local.setUint16(26, name.length, true); local.setUint16(28, 0, true);
      parts.push(local, name, data);
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
      c.setUint16(12, time, true); c.setUint16(14, date, true); c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true);
      c.setUint16(28, name.length, true); c.setUint32(42, offset, true);
      central.push(c, name);
      offset += 30 + name.length + data.length;
    }
    const cdSize = central.reduce((s, p) => s + p.byteLength, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
    return new Blob([...parts, ...central, end], { type: 'application/zip' });
  },

  /** A .zip Blob → [{ name, dir, blob(), text() }]. Throws if it isn't a zip. */
  async read(blob) {
    const buf = new Uint8Array(await blob.arrayBuffer()), v = new DataView(buf.buffer);
    let e = -1;
    for (let i = buf.length - 22; i >= Math.max(0, buf.length - 65557); i--) if (v.getUint32(i, true) === 0x06054b50) { e = i; break; }
    if (e < 0) throw new Error('not a zip');
    const count = v.getUint16(e + 10, true);
    let p = v.getUint32(e + 16, true);
    const out = [], utf8 = new TextDecoder();
    for (let n = 0; n < count; n++) {
      if (v.getUint32(p, true) !== 0x02014b50) throw new Error('damaged zip');
      const method = v.getUint16(p + 10, true), csize = v.getUint32(p + 20, true);
      const nameLen = v.getUint16(p + 28, true), extraLen = v.getUint16(p + 30, true), commentLen = v.getUint16(p + 32, true);
      const local = v.getUint32(p + 42, true);
      const name = utf8.decode(buf.subarray(p + 46, p + 46 + nameLen));
      p += 46 + nameLen + extraLen + commentLen;
      const start = local + 30 + v.getUint16(local + 26, true) + v.getUint16(local + 28, true);
      const raw = buf.subarray(start, start + csize);
      const bytes = async () => {
        if (method === 0) return raw;
        if (method !== 8) throw new Error(`${name}: unsupported compression`);
        const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
        return new Uint8Array(await new Response(stream).arrayBuffer());
      };
      out.push({ name, dir: name.endsWith('/'), blob: async (type = '') => new Blob([await bytes()], { type }), text: async () => utf8.decode(await bytes()) });
    }
    return out;
  },
};

// ---------------------------------------------------------------------------------------------------------------
// Art: the sheet layout, recolouring, and the built-in starter parts (drawn in code at any frame size).
//
// Sheet layout (same as the engine and RPG Maker MV): 3 columns × 4 rows of frames.
//   Rows: 0 facing down (towards you), 1 facing left, 2 facing right, 3 facing up (away).
//   Columns: 0 step (left foot), 1 standing, 2 step (right foot). Walking plays 0, 1, 2, 1.
// Starter parts are designed on a 16 × 24 grid ("units") and drawn at a scale, so 32 × 48 frames are drawn
// natively at 2 pixels per unit, not blown up.
// ---------------------------------------------------------------------------------------------------------------

const ROWS = ['down', 'left', 'right', 'up'];
const FRAME_SIZES = [[16, 24], [32, 48], [48, 72]];

/* Colour helpers --------------------------------------------------------------------------------------------- */
const hexToRgb = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const rgbToHex = (r, g, b) => '#' + [r, g, b].map((v) => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

// The greys starter parts are drawn in. Mid grey (BASE) becomes exactly the colour picked.
const G = { light: '#dcdcdc', base: '#a8a8a8', dark: '#767676', deep: '#4a4a4a', out: '#17141c', white: '#ffffff' };
const BASE_LUM = 0.659;

/**
 * Recolour an image the way the builder's colour picker does:
 *  - grey pixels take the chosen colour (mid grey #a8a8a8 = the colour itself; lighter greys = highlights,
 *    darker greys = shadows, shifted a little towards blue so shadows don't look muddy);
 *  - near-black (outlines), pure white, and anything already coloured stay as drawn.
 */
function recolor(src, hex) {
  const w = src.width, h = src.height;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.drawImage(src, 0, 0);
  if (!hex) return c;
  const img = g.getImageData(0, 0, w, h), d = img.data;
  const col = hexToRgb(hex);
  const hi = mix(col, [255, 255, 255], 0.55);
  const lo = [col[0] * 0.28 + 6, col[1] * 0.28 + 6, col[2] * 0.36 + 18];
  for (let i = 0; i < d.length; i += 4) {
    if (!d[i + 3]) continue;
    const r = d[i], gg = d[i + 1], b = d[i + 2];
    const mx = Math.max(r, gg, b), mn = Math.min(r, gg, b);
    if ((mx - mn) / 255 > 0.06) continue;
    const lum = (0.299 * r + 0.587 * gg + 0.114 * b) / 255;
    if (lum < 0.13 || lum > 0.97) continue;
    const out = lum >= BASE_LUM ? mix(col, hi, Math.min(1, (lum - BASE_LUM) / (0.95 - BASE_LUM))) : mix(col, lo, Math.min(1, (BASE_LUM - lum) / (BASE_LUM - 0.13)));
    d[i] = out[0]; d[i + 1] = out[1]; d[i + 2] = out[2];
  }
  g.putImageData(img, 0, 0);
  return c;
}

/* Bodies ----------------------------------------------------------------------------------------------------- */
// Proportions on the 16 × 24 unit grid (feet at the bottom). hw = half width.
const BODIES = {
  masculine: {
    name: 'Masculine',
    head: { cx: 8, cy: 6.9, rx: 4.3, ry: 4.4 },
    neck: { y0: 10.4, y1: 12, hw: 1.15 },

    eye: { dx: 1.7, w: 1.15, h: 1.55 },
  },

    neck: { y0: 10.6, y1: 12.1, hw: 0.9 },
    torso: { y0: 11.8, y1: 17, top: 3.2, mid: 2.5, bot: 3.3 },
    arm: { hw: 0.78, y0: 12.1, y1: 16.9 },
    leg: { y0: 16.7, y1: 22.4, hw: 1.1, off: 1.45 },
    foot: { h: 1.05, ext: 0.25 },
    eye: { dx: 1.65, w: 1.1, h: 1.7, lashes: true },
  },
  kid: {
    name: 'Kid',
    head: { cx: 8, cy: 10.9, rx: 4.3, ry: 4.2 },
    neck: { y0: 14.4, y1: 15.5, hw: 0.9 },
    torso: { y0: 15.1, y1: 19.4, top: 2.9, mid: 2.75, bot: 2.8 },
    arm: { hw: 0.8, y0: 15.4, y1: 19.1 },
    leg: { y0: 19.1, y1: 22.5, hw: 1.05, off: 1.3 },
    foot: { h: 1.0, ext: 0.25 },
    eye: { dx: 1.75, w: 1.25, h: 1.95 },
  },
};
const BODY_IDS = ['kid', 'masculine', 'feminine'];

/**
 * Where everything is for one body, view (down / up / side, side = facing right) and walk frame (0, 1, 2).
 * Limbs are capsules (p0 → p1, radius r); `far` limbs are behind the torso.
 */
function pose(bodyId, view, frame) {
  const B = BODIES[bodyId], side = view === 'side';
  const k = frame === 0 ? 1 : frame === 2 ? -1 : 0; // step direction
  const head = { ...B.head };
  if (side) head.cx += 0.25;
  const sx = side ? 0.7 : 1; // torso is narrower seen from the side
  const t = B.torso;
  const torso = { cx: side ? 8.15 : 8, y0: t.y0, y1: t.y1, top: t.top * sx, mid: t.mid * sx, bot: t.bot * sx };
  const L = B.leg, A = B.arm;
  const legs = [], arms = [], feet = [];
  if (!side) {
    for (const s of [-1, 1]) {
      const lift = (k === 1 && s === -1) || (k === -1 && s === 1) ? 0.9 : 0;
      const x = 8 + s * L.off;
      legs.push({ p0: [x, L.y0], p1: [x, L.y1 - lift], r: L.hw, far: false });
      feet.push({ x0: x - L.hw - B.foot.ext, x1: x + L.hw + B.foot.ext, y0: L.y1 - lift - 0.25, y1: L.y1 - lift + B.foot.h, far: false });
      const ax = 8 + s * (t.top + A.hw - 0.35);
      const up = (k === 1 && s === -1) || (k === -1 && s === 1) ? 0.55 : 0;
      arms.push({ p0: [ax, A.y0], p1: [ax + s * 0.15, A.y1 - up], r: A.hw, far: false });
    }
  } else {
    for (const s of [1, -1]) { // front leg first in the list, drawn last
      const far = s === -1;
      const dx = 1.5 * k * s;
      legs.push({ p0: [torso.cx, L.y0], p1: [torso.cx + dx, L.y1 - (far && k ? 0.3 : 0)], r: L.hw * 0.95, far });
      const fx = torso.cx + dx, fy = L.y1 - (far && k ? 0.3 : 0);
      feet.push({ x0: fx - L.hw * 0.8, x1: fx + L.hw + 1.0, y0: fy - 0.25, y1: fy + B.foot.h, far });
      const hand = torso.cx - 1.3 * k * s;
      arms.push({ p0: [torso.cx - 0.15, A.y0 + 0.3], p1: [hand, A.y1], r: A.hw, far });
    }
    legs.reverse(); feet.reverse(); arms.reverse(); // far ones first
  }
  return { body: B, bodyId, view, frame, head, torso, neck: B.neck, legs, arms, feet };
}

/* Shapes (tests on unit coordinates) ------------------------------------------------------------------------- */
const ell = (cx, cy, rx, ry) => (x, y) => ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 <= 1;
const rect = (x0, y0, x1, y1) => (x, y) => x >= x0 && x < x1 && y >= y0 && y < y1;
/** Capsule p0 → p1 with radius r; `t0`/`t1` cut it to part of its length (0 = p0, 1 = p1). */
function capsule(p0, p1, r, t0 = -1, t1 = 2) {
  const dx = p1[0] - p0[0], dy = p1[1] - p0[1], len2 = dx * dx + dy * dy || 1;
  return (x, y) => {
    let t = ((x - p0[0]) * dx + (y - p0[1]) * dy) / len2;
    if (t < t0 || t > t1) return false;
    t = Math.max(0, Math.min(1, t));
    const px = p0[0] + dx * t - x, py = p0[1] + dy * t - y;
    return px * px + py * py <= r * r;
  };
}
/** The torso: rounded shoulders, a waist, hips. `grow` widens it, y0/y1 override its height. */
function torsoShape(T, grow = 0, y0 = T.y0, y1 = T.y1) {
  const midY = T.y0 + (T.y1 - T.y0) * 0.58;
  return (x, y) => {
    if (y < y0 || y >= y1) return false;
    let hw;
    if (y < midY) hw = T.top + (T.mid - T.top) * ((y - T.y0) / (midY - T.y0));
    else hw = T.mid + (T.bot - T.mid) * Math.min(1, (y - midY) / (T.y1 - midY));
    // Rounded shoulders.
    const s = y - T.y0;
    if (s < 1.1) hw -= (1.1 - s) ** 2 * 0.9;
    return Math.abs(x - T.cx) <= hw + grow;
  };
}
/** A trapezoid centred on cx (skirts, capes). */
const trap = (cx, y0, y1, hw0, hw1) => (x, y) => y >= y0 && y < y1 && Math.abs(x - cx) <= hw0 + (hw1 - hw0) * ((y - y0) / (y1 - y0));
const tri = (ax, ay, bx, by, cx, cy) => (x, y) => {
  const d1 = (x - bx) * (ay - by) - (ax - bx) * (y - by), d2 = (x - cx) * (by - cy) - (bx - cx) * (y - cy), d3 = (x - ax) * (cy - ay) - (cx - ax) * (y - ay);
  return !(((d1 < 0) || (d2 < 0) || (d3 < 0)) && ((d1 > 0) || (d2 > 0) || (d3 > 0)));
};
const or = (...fs) => (x, y) => fs.some((f) => f && f(x, y));
const and = (...fs) => (x, y) => fs.every((f) => f(x, y));
const not = (f) => (x, y) => !f(x, y);

/* Painting a layer ------------------------------------------------------------------------------------------- */
// A layer is painted shape by shape into one frame. Each shape is shaded light (top-left) → dark (bottom-right)
// across its own box; where a shape overlaps what's already painted its edge gets a darker line (2× and up),
// and at the end the whole layer gets a near-black outline.

class Frame {
  constructor(fw, fh, s) { this.w = fw; this.h = fh; this.s = s; this.px = new Array(fw * fh).fill(null); }
  at(x, y) { return x < 0 || y < 0 || x >= this.w || y >= this.h ? null : this.px[y * this.w + x]; }
  put(x, y, c) { if (x >= 0 && y >= 0 && x < this.w && y < this.h) this.px[y * this.w + x] = c; }
  /**
   * shape(x, y) in units; box [x0, y0, x1, y1] for shading; opts: { ramp: [light, base, dark], flat, shade,
   * noEdge, color (a single colour) }.
   */
  paint(shape, box, opts = {}) {
    const s = this.s, mask = new Uint8Array(this.w * this.h);
    const [bx0, by0, bx1, by1] = box;
    const ramp = opts.ramp ?? [G.light, G.base, G.dark];
    const offs = opts.shade ?? 0;
    for (let py = 0; py < this.h; py++) for (let px = 0; px < this.w; px++) {
      const ux = (px + 0.5) / s, uy = (py + 0.5) / s;
      if (!shape(ux, uy)) continue;
      mask[py * this.w + px] = 1;
      let col;
      if (opts.color) col = opts.color;
      else if (opts.flat) col = ramp[1];
      else {
        const nx = ((ux - bx0) / Math.max(0.01, bx1 - bx0)) * 2 - 1, ny = ((uy - by0) / Math.max(0.01, by1 - by0)) * 2 - 1;
        const d = nx * 0.55 + ny * 0.85 + offs;
        col = d < -0.62 ? ramp[0] : d > 0.55 ? ramp[2] : ramp[1];
      }
      this.px[py * this.w + px] = col;
    }
    const prev = (this._painted ??= new Uint8Array(this.w * this.h));
    // Where this shape covers something already painted, darken its edge so the two read apart (2× and up).
    if (!opts.noEdge && s >= 2) {
      for (let py = 0; py < this.h; py++) for (let px = 0; px < this.w; px++) {
        const i = py * this.w + px;
        if (!mask[i]) continue;
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const qx = px + dx, qy = py + dy;
          if (qx < 0 || qy < 0 || qx >= this.w || qy >= this.h) continue;
          const j = qy * this.w + qx;
          if (!mask[j] && prev[j]) { this.px[i] = opts.edge ?? G.deep; break; }
        }
      }
    }
    for (let i = 0; i < mask.length; i++) if (mask[i]) prev[i] = 1;
    return this;
  }
  /** Near-black outline around everything painted. */
  outline(color = G.out) {
    const add = [];
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      if (this.at(x, y)) continue;
      if (this.at(x + 1, y) || this.at(x - 1, y) || this.at(x, y + 1) || this.at(x, y - 1)) add.push([x, y]);
    }
    for (const [x, y] of add) this.put(x, y, color);
    return this;
  }
  /** Single pixels in unit coordinates (details: highlights, nostrils). */
  dot(ux, uy, c) { this.put(Math.floor(ux * this.s), Math.floor(uy * this.s), c); return this; }
  toImageData() {
    const img = new ImageData(this.w, this.h);
    for (let i = 0; i < this.px.length; i++) {
      const c = this.px[i];
      if (!c) continue;
      const [r, g, b] = hexToRgb(c.slice(0, 7));
      img.data[i * 4] = r; img.data[i * 4 + 1] = g; img.data[i * 4 + 2] = b;
      img.data[i * 4 + 3] = c.length > 7 ? parseInt(c.slice(7), 16) : 255;
    }
    return img;
  }
}

const boxOf = (P) => [P.head.cx - P.head.rx, P.head.cy - P.head.ry, P.head.cx + P.head.rx, P.head.cy + P.head.ry];
const limbBox = (l) => [Math.min(l.p0[0], l.p1[0]) - l.r, Math.min(l.p0[1], l.p1[1]), Math.max(l.p0[0], l.p1[0]) + l.r, Math.max(l.p0[1], l.p1[1])];
const torsoBox = (T, y0 = T.y0, y1 = T.y1) => [T.cx - T.top, y0, T.cx + T.top, y1];

function drawEyes(f, P, size) {
  if (P.view === 'up') return;
  const H = P.head, E = P.body.eye, s = f.s;
  const h = E.h * size, y0 = H.cy + 0.35 + (E.h - h) * 0.6;
  const list = P.view === 'side' ? [H.cx + H.rx * 0.5] : [H.cx - E.dx, H.cx + E.dx];
  const w = P.view === 'side' ? E.w * 0.8 : E.w;
  for (const cx of list) {
    const x0 = cx - w / 2;
    // Iris (takes the eye colour), dark top row (lid), white glint.
    f.paint(rect(x0, y0, x0 + w, y0 + h), [x0, y0, x0 + w, y0 + h], { flat: true, noEdge: true });
    const px0 = Math.floor(x0 * s), py0 = Math.floor(y0 * s), pw = Math.max(1, Math.round(w * s)), ph = Math.max(1, Math.round(h * s));
    for (let x = px0; x < px0 + pw; x++) f.put(x, py0, G.out);
    if (ph > 1 && s >= 2) for (let y = py0 + ph - 1, x = px0; x < px0 + pw; x++) f.put(x, y, G.deep);
    if (s >= 2 && ph > 2) f.put(cx < H.cx ? px0 + pw - 1 : px0, py0 + 1, G.white);
    if (E.lashes && s >= 2) f.put(cx < H.cx || P.view === 'side' ? (P.view === 'side' ? px0 + pw : px0 - 1) : px0 + pw, py0, G.out);
  }
}

function drawHair(f, P, style) {
  const H = P.head, side = P.view === 'side', up = P.view === 'up';
  const cap = ell(H.cx, H.cy - 0.3, H.rx + 0.35, H.ry + 0.32);
  const fringe = (x) => H.cy - 1.0 + 0.45 * Math.sin((x - H.cx) * 2.3);
  let shape;
  if (up) shape = and(ell(H.cx, H.cy - 0.2, H.rx + 0.35, H.ry + 0.35), (x, y) => y < H.cy + H.ry * 0.72);
  else if (side) shape = and(cap, (x, y) => y < H.cy + H.ry * 0.78, (x, y) => y < fringe(x) || x < H.cx - 0.3 + (y - H.cy) * -0.15);
